<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample Job Application Form</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 42rem; margin: 0 auto; padding: 2rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], textarea, select {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
        }
        button { padding: 10px 20px; background: #059669; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div style="max-width: 600px; margin: 0 auto; background: #f9fafb; padding: 30px; border-radius: 8px;">
        <h2>Apply for Software Engineer</h2>
        <form action="#" method="get">
            <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="linkedin">LinkedIn Profile</label>
                <input type="text" id="linkedin" name="linkedin">
            </div>

            <div class="form-group">
                <label for="why_join">Why do you want to join our company?</label>
                <textarea id="why_join" name="why_join" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="resume">Upload Resume</label>
                <input type="file" id="resume" name="resume">
            </div>

            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
