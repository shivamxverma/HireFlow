<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f6f7fb; }
      .panel { fill: #ffffff; stroke: #d7dce5; stroke-width: 2; rx: 20; }
      .panel-title { font: 700 24px Arial, sans-serif; fill: #1f2937; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 14; }
      .box-blue { fill: #eef6ff; stroke: #5b9cff; stroke-width: 2; rx: 14; }
      .box-green { fill: #eefcf4; stroke: #53b67b; stroke-width: 2; rx: 14; }
      .box-purple { fill: #f5f0ff; stroke: #8b6df2; stroke-width: 2; rx: 14; }
      .box-orange { fill: #fff5ea; stroke: #f59e0b; stroke-width: 2; rx: 14; }
      .box-gray { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
      .label { font: 600 18px Arial, sans-serif; fill: #111827; }
      .small { font: 500 15px Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 13px Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrowheadSoft); }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 17px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrowheadSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
