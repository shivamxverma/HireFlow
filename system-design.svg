  <rect class="bg" x="0" y="0" width="1600" height="980"/>

  <text class="title" x="60" y="60">Hireflow System Design</text>
  <text class="subtitle" x="60" y="92">Clean architecture view of the full repository: ingestion, processing, automation, and outreach.</text>

  <rect class="panel" x="50" y="130" width="240" height="220"/>
  <text class="panel-title" x="75" y="170">User Interfaces</text>
  <rect class="box-blue" x="75" y="195" width="190" height="55"/>
  <text class="label" x="103" y="228">Next.js Frontend</text>
  <rect class="box-blue" x="75" y="270" width="190" height="55"/>
  <text class="label" x="97" y="303">Chrome Extension</text>

  <rect class="panel" x="350" y="130" width="330" height="290"/>
  <text class="panel-title" x="375" y="170">Backend API</text>
  <rect class="box" x="375" y="195" width="280" height="55"/>
  <text class="label" x="446" y="228">Routes / Controllers</text>
  <rect class="box" x="375" y="270" width="280" height="55"/>
  <text class="label" x="453" y="303">Core Services</text>
  <rect class="box" x="375" y="345" width="130" height="50"/>
  <text class="label" x="405" y="377">Scheduler</text>
  <rect class="box" x="525" y="345" width="130" height="50"/>
  <text class="label" x="542" y="377">Connector Runner</text>

  <rect class="panel" x="740" y="130" width="300" height="330"/>
  <text class="panel-title" x="765" y="170">Connectors</text>
  <rect class="box-orange" x="765" y="195" width="250" height="50"/>
  <text class="label" x="842" y="227">LinkedIn</text>
  <rect class="box-orange" x="765" y="260" width="250" height="50"/>
  <text class="label" x="836" y="292">Wellfound</text>
  <rect class="box-orange" x="765" y="325" width="250" height="50"/>
  <text class="label" x="872" y="357">YC</text>
  <rect class="box-orange" x="765" y="390" width="250" height="50"/>
  <text class="label" x="838" y="422">Telegram</text>

  <rect class="panel" x="1100" y="130" width="430" height="330"/>
  <text class="panel-title" x="1125" y="170">External Systems</text>
  <rect class="box-gray" x="1125" y="195" width="175" height="50"/>
  <text class="label" x="1178" y="227">LinkedIn</text>
  <rect class="box-gray" x="1325" y="195" width="175" height="50"/>
  <text class="label" x="1371" y="227">Wellfound</text>
