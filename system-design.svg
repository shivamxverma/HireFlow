  <text class="label" x="1146" y="292">WorkAtAStartup</text>
  <rect class="box-gray" x="1325" y="260" width="175" height="50"/>
  <text class="label" x="1380" y="292">Telegram</text>
  <rect class="box-gray" x="1125" y="325" width="175" height="50"/>
  <text class="label" x="1150" y="357">Playwright / Chrome</text>
  <rect class="box-gray" x="1325" y="325" width="175" height="50"/>
  <text class="label" x="1355" y="357">Gmail / OAuth</text>
  <rect class="box-gray" x="1225" y="390" width="175" height="50"/>
  <text class="label" x="1250" y="422">Gemini / OpenAI</text>

  <rect class="panel" x="50" y="510" width="500" height="350"/>
  <text class="panel-title" x="75" y="550">Background Workers (BullMQ)</text>
  <rect class="box-purple" x="75" y="580" width="200" height="60"/>
  <text class="label" x="127" y="615">Resume Worker</text>
  <rect class="box-purple" x="320" y="580" width="200" height="60"/>
  <text class="label" x="358" y="615">Auto Apply Worker</text>
  <rect class="box-purple" x="75" y="685" width="200" height="60"/>
  <text class="label" x="88" y="720">Telegram Extraction</text>
  <rect class="box-purple" x="320" y="685" width="200" height="60"/>
  <text class="label" x="366" y="720">Outreach Worker</text>
  <text class="small" x="80" y="785">Async pipelines handled here:</text>
  <text class="tiny" x="80" y="813">resume generation, auto-apply, Telegram parsing, outreach sending</text>

  <rect class="panel" x="630" y="510" width="330" height="260"/>
  <text class="panel-title" x="655" y="550">Data Layer</text>
  <rect class="box-green" x="655" y="580" width="280" height="55"/>
  <text class="label" x="731" y="613">PostgreSQL / Prisma</text>
  <rect class="box-green" x="655" y="650" width="280" height="55"/>
  <text class="label" x="740" y="683">Redis Queue</text>
  <rect class="box-green" x="655" y="720" width="280" height="55"/>
  <text class="label" x="709" y="753">File Storage</text>

  <rect class="panel" x="1030" y="510" width="500" height="350"/>
  <text class="panel-title" x="1055" y="550">Primary Flows</text>
  <text class="small" x="1060" y="595">1. Job ingestion:</text>
  <text class="tiny" x="1060" y="620">Scheduler -&gt; Connector Runner -&gt; Connectors -&gt; DB</text>
  <text class="small" x="1060" y="665">2. Resume + apply:</text>
  <text class="tiny" x="1060" y="690">Application -&gt; Resume Worker -&gt; Auto Apply Worker -&gt; Job Site</text>
  <text class="small" x="1060" y="735">3. Telegram:</text>
  <text class="tiny" x="1060" y="760">Messages -&gt; Extraction Worker -&gt; LLM -&gt; DB</text>
  <text class="small" x="1060" y="805">4. Outreach:</text>
  <text class="tiny" x="1060" y="830">Profiles / Leads -&gt; Outreach Worker -&gt; Gmail / LinkedIn</text>

